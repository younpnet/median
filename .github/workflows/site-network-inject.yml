# 사이트 네트워크 — 관련 글 링크를 HTML 에 직접 써 넣기 (SEO)
# https://median.younp.net 저장소의 .github/workflows/ 폴더에 넣으세요.

name: 사이트 네트워크 링크 갱신

on:
  schedule:
    - cron: "47 19 * * *"   # 매일 한국시간 새벽 4:47
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 관련 글 링크를 HTML 에 넣기
        run: |
          curl -fsSL https://hub.virz.net/inject.py -o /tmp/inject.py
          python3 /tmp/inject.py --site "https://median.younp.net" --root "." --auto --layout card --script --script-attrs 'data-auto="related,random"'

      - name: 변경 사항 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "사이트 네트워크 링크 갱신"
            git push
          fi
